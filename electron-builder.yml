appId: com.readpilot.desktop
productName: ReadPilot
directories:
  output: dist-electron
files:
  - electron/**
  - package.json
  - "!node_modules/**"
extraMetadata:
  dependencies: {}
  devDependencies: {}
extraResources:
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
      - "!server-smoke.*.log"
  - from: .next/readpilot-skill-pack
    to: readpilot-skill-pack
npmRebuild: false
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
